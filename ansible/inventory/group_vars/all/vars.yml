---
# Public variables (safe to commit to git)
# These reference the encrypted vault variables

# Cloudflare API token for DNS-01 challenge
# The actual token is stored in vault.yml (encrypted)
cloudflare_api_token: "{{ vault_cloudflare_api_token }}"

# Claude Code SSH key for read-only troubleshooting access
# Used when composing the claude-user role into other playbooks.
# The standalone setup-claude-user.yml generates a key automatically.
claude_ssh_public_key: "{{ vault_claude_ssh_public_key }}"

# Foundation data stores (R730xd)
postgres_password: "{{ vault_postgres_password }}"
kv_cache_password: "{{ vault_kv_cache_password }}"
clickhouse_password: "{{ vault_clickhouse_password }}"
# ClickHouse's server-wide memory ceiling, in bytes. Lives here rather than in
# the r730xd-clickhouse role because the Prometheus alert rules compare against
# it too, and those render from a different playbook — a role default would be
# out of scope there and the threshold would silently evaluate against nothing.
clickhouse_max_server_memory_bytes: 8589934592  # 8 GiB

# versitygw stores (ADR-055). Root creds per gateway — the bootstrap admin
# each gateway boots with. All other S3 accounts live in the gateway's own
# file IAM store (ADR-072) and are managed through its admin API.
s3_hot_root_access_key: "{{ vault_s3_hot_root_access_key }}"
s3_hot_root_secret_key: "{{ vault_s3_hot_root_secret_key }}"
s3_bulk_root_access_key: "{{ vault_s3_bulk_root_access_key }}"
s3_bulk_root_secret_key: "{{ vault_s3_bulk_root_secret_key }}"

# Observability stack (R730xd)
grafana_admin_password: "{{ vault_grafana_admin_password }}"
obs_s3_access_key: "{{ vault_obs_s3_access_key }}"
obs_s3_secret_key: "{{ vault_obs_s3_secret_key }}"

# Alerting — Discord webhook for Alertmanager notifications
monitoring_discord_webhook_url: "{{ vault_monitoring_discord_webhook_url }}"

# Alerting — ntfy publish token for severity=critical phone pushes
monitoring_ntfy_critical_token: "{{ vault_monitoring_ntfy_critical_token }}"

# Flux CD — Discord webhook for GitOps reconciliation alerts (separate channel)
flux_discord_webhook_url: "{{ vault_flux_discord_webhook_url }}"

# GitHub Actions Runner Controller (ARC v2) — org-level PAT
github_runner_pat: "{{ vault_github_runner_pat }}"

# Argo Workflows — s3-bulk versitygw account for artifact storage
argo_s3_access_key: "{{ vault_argo_s3_access_key }}"
argo_s3_secret_key: "{{ vault_argo_s3_secret_key }}"

# sccache — s3-bulk versitygw account for Rust build cache
sccache_s3_access_key: "{{ vault_sccache_s3_access_key }}"
sccache_s3_secret_key: "{{ vault_sccache_s3_secret_key }}"

# WiFi PSKs for the Aerohive APs (AP630 + AP130). The APs are configured from
# committed HiveOS scripts (ansible/files/aerohive/) carrying __WIFI_PSK__ /
# __WIFI_PSK2__ placeholders, rendered in at paste time per
# docs/runbooks/aerohive-ap-setup.md and never committed. Public repo — the real
# PSKs live only in the encrypted vault.yml. `home` = the existing SSID (the
# restricted segment, VLAN 20); `trusted` = the trusted SSID (VLAN 30).
home_wifi_psk: "{{ vault_home_wifi_psk }}"
trusted_wifi_psk: "{{ vault_trusted_wifi_psk }}"

# WireGuard ingress tunnel keys (VPS ↔ R730xd)
# Public keys are safe to expose; private keys stay in vault.yml and are
# only referenced directly inside the ingress-tunnel role template.
# See docs/decisions/019-ingress-and-tls-termination.md
wg_vps_public_key: "{{ vault_wg_vps_public_key }}"
wg_r730xd_public_key: "{{ vault_wg_r730xd_public_key }}"

# -----------------------------------------------------------------------
# Platform secrets via 1Password
# -----------------------------------------------------------------------
# The vault holding every platform secret. Consuming playbooks load
# ansible/vars/onepassword_secrets.yml in their pre_tasks, which redefines
# each vault_* as an `op` lookup against this vault. Lookups are lazy, so a
# play only spends API calls on the variables it actually references.
onepassword_vault: "grizzly-platform"

# Date the eso-reader / ansible-reader service account tokens were minted,
# YYYY-MM-DD. This is recorded by hand because a token's expiry is not
# readable from the token: `op whoami`, `op account get` and
# `op service-account` all omit it, and the token itself carries no exp
# claim. 1Password caps service account lifetime at 90 days (the CLI rejects
# --expires-in >= 2160h), so age since minting is a sound proxy for "running
# out of time" without needing the exact --expires-in value.
#
# Prometheus turns this into onepassword_token_minted_timestamp_seconds and
# alerts on age (see the external-secrets rule group). Update this whenever a
# token is re-minted, and re-run setup-1password-eso.yml.
onepassword_tokens_minted: "2026-08-01"

