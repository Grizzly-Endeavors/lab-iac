---
# deploy-foundation-stores.yml — Deploy foundation data stores to R730xd
#
# Deploys PostgreSQL, kv-cache (Valkey), ClickHouse, and the versitygw S3
# stores (s3-hot/s3-bulk, ADR-055) as Docker Compose services on the R730xd
# storage server.
#
# Storage tiers:
#   Hot (ZFS):     PostgreSQL, kv-cache, ClickHouse, s3-hot — continuous-write
#   Cold (MergerFS): s3-bulk — write-once-read-many (registry, artifacts)
#
# These services are consumed by K8s workloads (via <r730xd_ip>:<port>)
# and staging VM services. They run on R730xd because stateful workloads
# belong on the storage server, not in K8s (diskless nodes).
#
# See ADR-003 for design decisions.
#
# Prerequisites:
#   - R730xd baseline applied (setup-r730xd.yml — installs Docker)
#   - R730xd storage stack deployed (r730xd-storage.yml — MergerFS pool)
#   - ZFS pool and datasets created (r730xd-zfs.yml)
#   - Vault secrets configured (see vault.yml.example)
#
# Usage:
#   ansible-playbook -i ansible/inventory \
#     ansible/playbooks/deploy-foundation-stores.yml \
#     --vault-password-file .vault_pass -v
#
# Deploy individual services:
#   ... --tags postgres
#   ... --tags kv-cache
#   ... --tags clickhouse
#   ... --tags s3-hot      (versitygw)
#   ... --tags s3-bulk     (versitygw)
#
# Endpoints (after deploy) — IPs from ansible/inventory/group_vars/all/network.yml:
#   PostgreSQL:        postgresql://postgres:<password>@<r730xd_ip>:5432/
#   kv-cache (Valkey): redis://:<password>@<r730xd_ip>:6379
#   ClickHouse:        http://<r730xd_ip>:8123  (native :9000, metrics :9126)
#   s3-hot (versitygw):  http://<r730xd_ip>:7070  (metrics :9102)
#   s3-bulk (versitygw): http://<r730xd_ip>:7072  (metrics :9103)

- name: Deploy foundation data stores
  hosts: r730xd
  become: yes
  gather_facts: yes

  # in pre_tasks and redefines vault_* to read from 1Password). See

  pre_tasks:
    - name: Load 1Password-sourced platform secrets
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vars/onepassword_secrets.yml"
      tags: [always]

    - name: Verify ZFS pool is mounted
      ansible.builtin.command: findmnt /mnt/zfs
      changed_when: false
      failed_when: zfs_check.rc != 0
      register: zfs_check
      tags: [always]

    - name: Verify MergerFS pool is mounted
      ansible.builtin.command: findmnt /mnt/pool
      changed_when: false
      failed_when: pool_check.rc != 0
      register: pool_check
      tags: [always]

    - name: Verify Docker is installed
      ansible.builtin.command: docker --version
      changed_when: false
      failed_when: docker_installed.rc != 0
      register: docker_installed
      tags: [always]

    - name: Verify Docker is running
      ansible.builtin.service_facts:
      tags: [always]

    - name: Fail if Docker service is not running
      ansible.builtin.fail:
        msg: >
          Docker is not running. Run setup-r730xd.yml first to install and
          enable Docker.
      when: "'docker.service' not in ansible_facts.services or
             ansible_facts.services['docker.service'].state != 'running'"
      tags: [always]

  roles:
    - role: r730xd-postgres
      tags: [foundation, postgres]
    - role: r730xd-kv-cache
      tags: [foundation, kv-cache]
    # OLAP store — single node, no Keeper. Backs Langfuse.
    - role: r730xd-clickhouse
      tags: [foundation, clickhouse]
    # versitygw S3 stores (ADR-055). Accounts live in each gateway's own
    # file IAM store on ZFS (ADR-072) — no external IAM prereq.
    - role: r730xd-s3-hot
      tags: [foundation, s3-hot]
    - role: r730xd-s3-bulk
      tags: [foundation, s3-bulk]
