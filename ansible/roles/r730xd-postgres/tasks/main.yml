---
# r730xd-postgres: Deploy PostgreSQL as a Docker Compose service

- name: Create Postgres directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ postgres_data_dir }}"
    - "{{ postgres_backup_dir }}"
    - "{{ postgres_compose_dir }}"

# The foundation image is stock postgres plus pgvector + VectorChord. It is built
# here on the host rather than pulled: the foundation stores must come up without
# depending on the in-cluster registry, which itself sits downstream of them.
- name: Deploy the foundation Postgres Dockerfile
  ansible.builtin.copy:
    src: Dockerfile
    dest: "{{ postgres_compose_dir }}/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  register: postgres_dockerfile

- name: Check whether the foundation Postgres image is already built
  ansible.builtin.command: docker image inspect {{ postgres_image }}
  register: postgres_image_present
  changed_when: false
  failed_when: false

- name: Build the foundation Postgres image
  ansible.builtin.command:
    cmd: >-
      docker build
      --build-arg POSTGRES_VERSION={{ postgres_version }}
      --build-arg PGVECTOR_VERSION={{ postgres_pgvector_version }}
      --build-arg VECTORCHORD_VERSION={{ postgres_vectorchord_version }}
      -t {{ postgres_image }}
      .
    chdir: "{{ postgres_compose_dir }}"
  when: postgres_image_present.rc != 0 or postgres_dockerfile.changed
  notify: Restart foundation-postgres

- name: Deploy Postgres docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ postgres_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart foundation-postgres

- name: Ensure Postgres is running
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ postgres_compose_dir }}"
  register: postgres_up
  changed_when: "'Started' in postgres_up.stderr or 'Created' in postgres_up.stderr"

- name: Wait for Postgres to accept connections
  ansible.builtin.wait_for:
    port: "{{ postgres_port }}"
    delay: 3
    timeout: 60

- name: Verify Postgres health
  ansible.builtin.command: docker exec foundation-postgres pg_isready -U postgres -p {{ postgres_port }}
  register: pg_health
  retries: 5
  delay: 5
  until: pg_health.rc == 0
  changed_when: false

- name: Deploy Postgres backup script
  ansible.builtin.template:
    src: pg-backup.sh.j2
    dest: "{{ postgres_compose_dir }}/pg-backup.sh"
    owner: root
    group: root
    mode: "0750"
  when: postgres_backup_enabled | bool

- name: Schedule daily Postgres backup
  ansible.builtin.cron:
    name: "foundation-postgres-backup"
    job: "{{ postgres_compose_dir }}/pg-backup.sh >> /var/log/pg-backup.log 2>&1"
    hour: "{{ postgres_backup_cron_hour }}"
    minute: "{{ postgres_backup_cron_minute }}"
    user: root
  when: postgres_backup_enabled | bool

- name: Display Postgres summary
  ansible.builtin.debug:
    msg:
      - "=== PostgreSQL {{ postgres_version }} ==="
      - ""
      - "Connection: postgresql://postgres:<password>@{{ ansible_facts['default_ipv4']['address'] | default(r730xd_ip) }}:{{ postgres_port }}/"
      - "Data: {{ postgres_data_dir }}"
      - "Compose: {{ postgres_compose_dir }}"
      - "Backup: {{ 'daily at ' ~ postgres_backup_cron_hour ~ ':' ~ postgres_backup_cron_minute ~ ' → ' ~ postgres_backup_dir if postgres_backup_enabled | bool else 'disabled' }}"
      - ""
      - "Tuning: shared_buffers={{ postgres_shared_buffers }}, work_mem={{ postgres_work_mem }}, max_connections={{ postgres_max_connections }}"
