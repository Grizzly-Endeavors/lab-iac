# Metabase credentials. Three of the four are store credentials provisioned by
# setup-metabase-stores.yml; `encryption_key` is app-level crypto material.
#
# Metabase holds TWO distinct kinds of credential and they must not be
# confused. `db_password` is the `metabase` role that OWNS Metabase's own
# database (dashboards, questions, users) and is passed as MB_DB_PASS.
# `readonly_db_password` and `clickhouse_password` belong to the `metabase_ro`
# accounts Metabase uses to READ other apps' data — they are entered as data
# source credentials and stored, encrypted, inside Metabase's own DB. Handing
# Metabase an owner credential for a data source would let any native query
# mutate that app's tables.
vault_metabase_db_password: >-
  {{ lookup('community.general.onepassword',
            'stores-metabase',
            field='db_password',
            vault=onepassword_vault,
            service_account_token=vault_op_service_account_token) | trim }}

vault_metabase_readonly_db_password: >-
  {{ lookup('community.general.onepassword',
            'stores-metabase',
            field='readonly_db_password',
            vault=onepassword_vault,
            service_account_token=vault_op_service_account_token) | trim }}

vault_metabase_clickhouse_password: >-
  {{ lookup('community.general.onepassword',
            'stores-metabase',
            field='clickhouse_password',
            vault=onepassword_vault,
            service_account_token=vault_op_service_account_token) | trim }}

# Encrypts data source credentials at rest in Metabase's application DB.
# Losing it does not lose dashboards, but every stored connection password
# becomes undecryptable and must be re-entered.
vault_metabase_encryption_key: >-
  {{ lookup('community.general.onepassword',
            'platform-metabase',
            field='encryption_key',
            vault=onepassword_vault,
            service_account_token=vault_op_service_account_token) | trim }}

