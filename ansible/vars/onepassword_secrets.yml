---
# Platform secrets, sourced from the 1Password `grizzly-platform` vault.
#
# Redefines each in-scope `vault_*` variable as a community.general.onepassword
# lookup. The lookup shells out to the `op` CLI on the controller and
# authenticates with a read-only service account token.
#
# Item titles mirror the layout these secrets had in KV: `<domain>-<name>`,
# with field labels unchanged. So `platform/cloudflare` + `api_token` reads as
# item `platform-cloudflare`, field `api_token`.
#
# Auth kwargs are passed INLINE in each lookup rather than through
# ansible_* vars: Ansible's lookup-plugin-vars integration doesn't template a
# value before handing it to the plugin, so an indirected token arrives as the
# literal string `{{ ... }}`. Inline kwargs go through Jinja at expression
# expansion and resolve correctly.
#
# Lookups are lazy — a play only spends API calls on the variables it actually
# references. That matters because 1Password meters requests per account per
# day, shared across every service account.
#
# Every lookup is `| trim`ed. The lookup shells out to `op`, whose output
# carries a trailing newline that survives into multiline values such as the
# GitHub App PEM — leaving it in place produces a value one byte longer than
# the source, which would make this play and the ExternalSecret that writes the
# same Kubernetes Secret disagree forever. No source value has leading or
# trailing whitespace, so trimming is a no-op on every other variable.
#
# DO NOT add this file to group_vars/ — it must be opt-in per playbook so that
# every IaC play isn't hard-coupled to 1Password availability. Include it via
# include_vars in each consuming playbook.
#
# See docs/decisions/024-platform-secrets-on-openbao.md.
# --- platform -----------------------------------------------------------
vault_cloudflare_api_token: >-
  {{ lookup('community.general.onepassword',
            'platform-cloudflare',
            field='api_token',
            vault=onepassword_vault,
            service_account_token=vault_op_service_account_token) | trim }}

