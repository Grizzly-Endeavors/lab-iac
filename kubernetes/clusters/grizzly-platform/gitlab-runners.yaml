# Self-hosted GitLab CI runners (ADR-071). Its own Flux Kustomization, like
# langfuse/metabase/ntfy, so an unhealthy runner never blocks core
# infrastructure from reaching Ready — and, more sharply, so it cannot
# deadlock: the manager pod does not start until ESO has synced its runner
# token, and inside the `infrastructure` Kustomization that unready pod would
# hold `infrastructure` short of Ready, which in turn gates the
# external-secrets-stores Kustomization the ClusterSecretStore comes from.
#
# dependsOn infrastructure so ESO and the onepassword ClusterSecretStore exist
# before the ExternalSecret here applies.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitlab-runners
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/gitlab-runners
  prune: true
  wait: true
  timeout: 5m
