# Syncs Authentik's secrets from 1Password into the authentik namespace. The
# HelmRelease's global.env wires these keys into the server + worker pods.
#
# Operator bootstrap (one-time), before first reconcile — the platform-authentik
# item in the grizzly-platform 1Password vault must carry secret_key, db_password,
# bootstrap_password and bootstrap_token. db_password must match the role created
# by setup-authentik.yml. The kv-cache and mail-sender credentials are read
# straight from their owning items (stores-kv-cache, platform-stalwart) rather
# than copied, so each stays single-source.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-secrets
    creationPolicy: Owner
  data:
    - secretKey: secret_key
      remoteRef:
        key: platform-authentik/secret_key
    - secretKey: db_password
      remoteRef:
        key: platform-authentik/db_password
    - secretKey: bootstrap_password
      remoteRef:
        key: platform-authentik/bootstrap_password
    - secretKey: bootstrap_token
      remoteRef:
        key: platform-authentik/bootstrap_token
    # Reuse the foundation kv-cache credential — single source of truth in
    # stores/kv-cache, shared with the other consumers of that instance.
    - secretKey: kv_cache_password
      remoteRef:
        key: stores-kv-cache/password
    # SMTP AUTH password for noreply@grizzly-endeavors.com, the Stalwart
    # submission account authentik sends one-time codes through (ADR-066).
    # Owned by the mail plant: configure-stalwart.yml injects this same field
    # into the Stalwart directory, so both sides read one value.
    - secretKey: email_password
      remoteRef:
        key: platform-stalwart/noreply_password
    # OIDC client credentials for the Nextcloud integration. Injected into the
    # worker via global.env (AUTHENTIK_NEXTCLOUD_CLIENT_*) and consumed by
    # blueprints/nextcloud.yaml through !Env. The same two keys feed Nextcloud's
    # own ExternalSecret in lab-apps — one source of truth for both sides.
    - secretKey: oidc_nextcloud_client_id
      remoteRef:
        key: platform-authentik/oidc_nextcloud_client_id
    - secretKey: oidc_nextcloud_client_secret
      remoteRef:
        key: platform-authentik/oidc_nextcloud_client_secret
    # OIDC client credentials for the career-scanner integration. Injected into
    # the worker via global.env (AUTHENTIK_CAREER_SCANNER_CLIENT_*) and consumed
    # by blueprints/career-scanner.yaml through !Env. The same two keys feed
    # career-scanner's own ExternalSecret in its deploy/ chart — one source of
    # truth for both sides.
    - secretKey: oidc_career_scanner_client_id
      remoteRef:
        key: platform-authentik/oidc_career_scanner_client_id
    - secretKey: oidc_career_scanner_client_secret
      remoteRef:
        key: platform-authentik/oidc_career_scanner_client_secret
    # OIDC client credentials for Immich. Injected into the worker via
    # global.env (AUTHENTIK_IMMICH_CLIENT_*) and consumed by
    # blueprints/immich.yaml through !Env. The same two keys feed Immich's own
    # ExternalSecret in lab-apps — one source of truth for both sides.
    - secretKey: oidc_immich_client_id
      remoteRef:
        key: platform-authentik/oidc_immich_client_id
    - secretKey: oidc_immich_client_secret
      remoteRef:
        key: platform-authentik/oidc_immich_client_secret
    # OIDC client credentials for Langfuse. Injected into the worker via
    # global.env (AUTHENTIK_LANGFUSE_CLIENT_*) and consumed by
    # blueprints/langfuse.yaml through !Env. The same two keys feed Langfuse's
    # own ExternalSecret — one source of truth for both sides.
    - secretKey: oidc_langfuse_client_id
      remoteRef:
        key: platform-authentik/oidc_langfuse_client_id
    - secretKey: oidc_langfuse_client_secret
      remoteRef:
        key: platform-authentik/oidc_langfuse_client_secret
    # OAuth client credentials for the social sources (Discord, GitHub). Injected
    # into the worker via global.env (AUTHENTIK_{DISCORD,GITHUB}_CLIENT_*) and
    # consumed by blueprints/social-login.yaml through !Env.
    - secretKey: oauth_discord_client_id
      remoteRef:
        key: platform-authentik/oauth_discord_client_id
    - secretKey: oauth_discord_client_secret
      remoteRef:
        key: platform-authentik/oauth_discord_client_secret
    - secretKey: oauth_github_client_id
      remoteRef:
        key: platform-authentik/oauth_github_client_id
    - secretKey: oauth_github_client_secret
      remoteRef:
        key: platform-authentik/oauth_github_client_secret
    - secretKey: oauth_google_client_id
      remoteRef:
        key: platform-authentik/oauth_google_client_id
    - secretKey: oauth_google_client_secret
      remoteRef:
        key: platform-authentik/oauth_google_client_secret
