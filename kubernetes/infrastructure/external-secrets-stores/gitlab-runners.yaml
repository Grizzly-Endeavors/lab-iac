# The GitLab runner authentication token (`glrt-...`) for the self-hosted
# runner pool (ADR-071). Minted in the GitLab UI when the runner is created —
# see docs/runbooks/gitlab-runners.md — and stored in 1Password.
#
# The chart mounts both keys as an explicit projected-volume item list, so
# `runner-registration-token` must exist even though it is unused: the legacy
# registration-token flow is not in play, and an absent key would leave the
# manager pod stuck unable to mount its secret. It is templated to an empty
# string rather than sourced from 1Password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-token
  namespace: gitlab-runners
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gitlab-runner-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        runner-token: "{{ .token }}"
        runner-registration-token: ""
  data:
    - secretKey: token
      remoteRef:
        key: cicd-gitlab-runner/token
