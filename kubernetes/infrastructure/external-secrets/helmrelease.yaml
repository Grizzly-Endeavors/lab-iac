apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      # Chart version tracks app version. Bump intentionally — ESO has
      # occasionally shipped breaking CRD changes between minors; read
      # the release notes and check that the provider fields and value
      # keys this release sets still exist before moving.
      version: "2.8.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  targetNamespace: external-secrets
  install:
    createNamespace: false
  values:
    installCRDs: true
    replicaCount: 1
    # Sized for 2.x with provider SDKs loaded. The controller links a client
    # per configured provider, so its footprint grows as stores are added —
    # 128Mi was survivable on 0.18.2 with one provider and OOMKilled the
    # moment the 1Password SDK came into play.
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 1000m
        memory: 768Mi
    webhook:
      replicaCount: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
    certController:
      replicaCount: 1
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          cpu: 500m
          memory: 256Mi
    # ServiceMonitor requires Prometheus Operator; r730xd Prometheus
    # scrapes ESO via a NodePort-exposed /metrics endpoint instead.
    serviceMonitor:
      enabled: false
    metrics:
      service:
        enabled: true
    # The operator runs under a dedicated SA (default "external-secrets"
    # in the chart).
    serviceAccount:
      create: true
      name: external-secrets
