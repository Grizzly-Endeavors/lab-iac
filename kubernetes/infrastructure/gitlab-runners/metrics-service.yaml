# Exposes the runner manager's Prometheus endpoint to the R730xd Prometheus,
# which scrapes over the LAN via NodePort. Port allocation is tracked in
# docs/nodeport-allocation.md.
apiVersion: v1
kind: Service
metadata:
  name: gitlab-runner-metrics
  namespace: gitlab-runners
spec:
  type: NodePort
  selector:
    app: gitlab-runner
  ports:
    - port: 9252
      targetPort: 9252
      nodePort: 30894
      protocol: TCP
      name: metrics
