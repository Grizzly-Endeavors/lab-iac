# RBAC for the GitLab Runner Kubernetes executor (ADR-071).
#
# Written by hand rather than left to the chart's `rbac.create`, which grants
# `apiGroups: [""] resources: ["*"] verbs: ["*"]` when `rbac.rules` is empty —
# far more than the executor needs. The rules below are the documented minimum
# for the Kubernetes executor, scoped to the job namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner
  namespace: gitlab-runners
---
# The identity job pods run as. It is granted nothing, and its token is not
# mounted — CI code from the GitLab group gets no Kubernetes API surface at
# all, not even self-inspection. `automountServiceAccountToken: false` is
# enforced by the API server at pod admission, so a job cannot opt back in.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-job
  namespace: gitlab-runner-jobs
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner
  namespace: gitlab-runner-jobs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch"]
  # The executor streams the build script into the build container over an
  # exec/attach session rather than baking it into the image.
  - apiGroups: [""]
    resources: ["pods/exec", "pods/attach"]
    verbs: ["create", "get", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # Per-job ConfigMaps carry the generated build scripts; per-job Secrets carry
  # image pull credentials. Both are created and torn down with the job pod.
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["create", "delete", "get", "update", "list"]
  # `services:` in .gitlab-ci.yml become sidecars reached by a headless Service.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner
  namespace: gitlab-runner-jobs
subjects:
  - kind: ServiceAccount
    name: gitlab-runner
    namespace: gitlab-runners
roleRef:
  kind: Role
  name: gitlab-runner
  apiGroup: rbac.authorization.k8s.io
