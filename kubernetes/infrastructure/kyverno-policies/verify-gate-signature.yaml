apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-gate-signature
  annotations:
    policies.kyverno.io/title: Verify CI gate signature
    policies.kyverno.io/description: >-
      Refuse to admit first-party images that lack a valid grizzly-gate cosign
      signature. The signature is produced by the CI gate only after all checks
      pass, so this is the deploy boundary that lets agents ship without manual
      review. Scoped to namespaces labelled grizzly.io/gated=true so upstream /
      third-party images (lab-apps) are unaffected.
spec:
  # background:false — image verification needs the admission-time context and
  # must not run as a background scan over existing pods.
  background: false
  # failurePolicy MUST track failureAction below. This rule is report-only
  # (failureAction: Audit), so a webhook that errors or times out must not block
  # admission — Fail here would let any registry slowness reject every pod in a
  # gated namespace, which is the opposite of what Audit means. The real deploy
  # boundary is enforce-gameservers-bot-signature, which keeps failurePolicy:
  # Fail. Flip this to Fail in the same change that flips failureAction: Enforce.
  # See docs/decisions/069-kyverno-failurepolicy-tracks-failureaction.md.
  failurePolicy: Ignore
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-first-party-images
      match:
        any:
          - resources:
              kinds:
                - Pod
              # Only gated namespaces. Label a namespace with
              # `grizzly.io/gated: "true"` to opt it into enforcement.
              namespaceSelector:
                matchLabels:
                  grizzly.io/gated: "true"
      verifyImages:
        - imageReferences:
            - "registry.registry.svc.cluster.local:5000/*"
          # Phase: start in Audit (report-only), flip to Enforce once all live
          # first-party images are signed. See kyverno-policies/README.md.
          # NOTE: when flipping to Enforce, also set mutateDigest: true to pin
          # tag→digest. Kyverno rejects mutateDigest:true under Audit (Audit is
          # report-only and cannot mutate), so it stays false in this phase.
          failureAction: Audit
          mutateDigest: false
          verifyDigest: true
          required: true
          attestors:
            - count: 1
              entries:
                - keys:
                    # grizzly-gate cosign PUBLIC key (not secret). Matches the
                    # private half in the 1Password item cicd-cosign.
                    # Rotate: regenerate keypair, op item edit, replace this block.
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE4KBckBkLKLINu9WATY50fiJXw1G7
                      2BUAREgh9iwDwJYbvIVdFrUeaTSgJF/nt8Y8ga++d5SzXAxft1Jr1VnqlA==
                      -----END PUBLIC KEY-----
                    # The gate signs with a private key and does NOT upload to a
                    # Rekor transparency log (no Rekor is deployed). Without this,
                    # cosign/Kyverno fails "signature not found in transparency
                    # log" — so this Audit policy has been silently reporting
                    # false failures. Skip tlog: the signature is still verified
                    # against the public key; tlog auditability needs Rekor.
                    rekor:
                      ignoreTlog: true
